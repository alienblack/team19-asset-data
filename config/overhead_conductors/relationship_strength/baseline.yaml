profile_name: baseline

description: >
  Baseline synthetic relationship profile. A strength of 1.0 reproduces the
  current conditional relationship effects used by the existing overhead
  conductor synthetic-data generator.

relationship_strengths:
  installation_year_to_voltage: 1.0
  voltage_to_location: 1.0
  voltage_to_corrosion: 1.0
  location_to_corrosion: 1.0

  installation_year_to_material: 1.0
  voltage_to_material: 1.0
  corrosion_to_material: 1.0