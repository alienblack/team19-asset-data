profile_name: strength_0

description: >
  Control profile with selected synthetic relationship strengths set to zero.
  This removes the configured direct relationship effects while retaining the
  underlying neutral/base distributions used by the generator.

relationship_strengths:
  installation_year_to_voltage: 0.0
  voltage_to_location: 0.0
  voltage_to_corrosion: 0.0
  location_to_corrosion: 0.0

  installation_year_to_material: 0.0
  voltage_to_material: 0.0
  corrosion_to_material: 0.0