[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-imputation-study"
version = "5.2.2"
description = "Synthetic asset imputation study with automated execution and reporting"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
imputation-study = "synthetic_imputation.cli:main"

[tool.setuptools.package-data]
synthetic_imputation = ["templates/*.html", "templates/*.css"]
