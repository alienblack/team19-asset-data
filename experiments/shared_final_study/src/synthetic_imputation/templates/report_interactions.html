<dialog id="chart-dialog"><header><strong id="dialog-title"></strong><button id="close-dialog" aria-label="Close enlarged chart">Close</button></header><img id="dialog-image" alt=""></dialog>
<script>
const mf=document.getElementById('method-filter'),tf=document.getElementById('target-filter'),sf=document.getElementById('text-filter');
function filterResults(){let visible=0;for(const row of document.querySelectorAll('#metrics tbody tr')){const show=(!mf.value||row.dataset.method===mf.value)&&(!tf.value||row.dataset.target===tf.value)&&row.textContent.toLowerCase().includes(sf.value.toLowerCase());row.classList.toggle('hidden',!show);if(show)visible++}document.getElementById('filter-count').textContent=visible+' result groups'}
if(mf&&tf&&sf){mf.addEventListener('change',filterResults);tf.addEventListener('change',filterResults);sf.addEventListener('input',filterResults);filterResults()}
async function printReport(){const button=document.getElementById('print-report');const old=button.textContent;button.disabled=true;button.textContent='Preparing figures…';let saved;try{const images=[...document.querySelectorAll('.chart img')];for(const image of images)image.loading='eager';await Promise.all(images.map(image=>image.decode()));if(mf){saved=[mf.value,tf.value,sf.value];mf.value=tf.value=sf.value='';filterResults()}button.textContent=old;button.disabled=false;window.print()}catch(error){alert('A figure could not be loaded. Reload the report before printing.')}finally{button.textContent=old;button.disabled=false;if(saved){[mf.value,tf.value,sf.value]=saved;filterResults()}}}
const dialog=document.getElementById('chart-dialog');document.querySelectorAll('.chart-image').forEach(button=>button.addEventListener('click',()=>{const image=button.querySelector('img');document.getElementById('dialog-image').src=image.src;document.getElementById('dialog-image').alt=image.alt;document.getElementById('dialog-title').textContent=image.alt;dialog.showModal()}));document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});document.querySelectorAll('.download-chart').forEach(button=>button.addEventListener('click',()=>{const a=document.createElement('a');a.href=button.closest('.chart').querySelector('img').src;a.download=button.dataset.name;a.click()}));
</script>
