[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-asset-imputation"
version = "1.1.0"
description = "Multi-asset data quality, profiling, cleaning, imputation and paired evaluation pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team 19, Master of Computer Science capstone" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
  "joblib>=1.3,<2",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.8,<4",
  "lightgbm>=4.0,<5",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# Notebook controllers live under notebook/; nbclient can execute them in a real kernel.
notebook = ["jupyter", "ipykernel", "nbformat>=5", "nbclient>=0.9"]
# TabPFN intentionally runs only in the separate foundation-model notebook.
tabpfn = ["tabpfn>=2.5,<4"]

[project.scripts]
oc-pipeline = "src.cli:main"
asset-pipeline = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.reporting" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::RuntimeWarning"]
